[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nomos-decision-engine"
version = "0.3.0"
description = "NOMOS deterministic decision-hub with structured evaluation, algorithm audit, scenario stress tests, and human governance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See repository LICENSE" }
authors = [
  { name = "NOHN AI" }
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3.0",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.29,<1.0",
  "asyncpg>=0.29,<1.0",
  "python-dotenv>=1.0,<2.0",
  "python-jose[cryptography]>=3.3,<4.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<9",
  "pytest-cov>=5,<7"
]

[project.scripts]
nomos-demo = "second_perspective.cli:main"
nomos-hub-demo = "second_perspective.hub_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
