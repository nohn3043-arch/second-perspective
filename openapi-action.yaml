openapi: 3.1.0
info:
  title: NOMOS Intelligent Decision-Hub
  description: Auditable decision orchestration with deterministic evaluation, causal counterfactuals,
    scenario stress tests, cognitive risk challenges, and governance.
  version: 0.3.0
paths:
  /health:
    get:
      summary: Health Check
      operationId: healthCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthcheck
  /v1/auth/me:
    get:
      summary: Auth Me
      operationId: authWhoAmI
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Authwhoami
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/hub/analyze:
    post:
      summary: Analyze Decision Hub
      operationId: analyzeDecisionHub
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/hub/reports/{hub_run_id}:
    get:
      summary: Get Decision Hub Report
      operationId: getDecisionHubReport
      parameters:
      - name: hub_run_id
        in: path
        required: true
        schema:
          type: string
          title: Hub Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/evaluate:
    post:
      summary: Evaluate Decision
      operationId: evaluateDecision
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest-Input'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/{decision_id}:
    get:
      summary: Get Decision
      operationId: getDecision
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/{decision_id}/history:
    get:
      summary: Get Decision History
      operationId: getDecisionHistory
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionRecord'
                title: Response Getdecisionhistory
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/{decision_id}/approval:
    post:
      summary: Record Decision Approval
      operationId: recordDecisionApproval
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/hub/sessions:
    post:
      summary: Start Reconstruction Session
      operationId: startReconstructionSession
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconstructionSession'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/hub/sessions/{session_id}/advance:
    post:
      summary: Advance Reconstruction Session
      operationId: advanceReconstructionSession
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceSessionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconstructionSession'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/hub/sessions/{session_id}/human-decision:
    post:
      summary: Human Session Decision
      operationId: humanSessionDecision
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanSessionDecisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconstructionSession'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/hub/sessions/{session_id}:
    get:
      summary: Get Reconstruction Session
      operationId: getReconstructionSession
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconstructionSession'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
components:
  schemas:
    AdvanceSessionRequest:
      properties:
        delta_vars:
          items:
            $ref: '#/components/schemas/DeltaVar'
          type: array
          title: Delta Vars
          default: []
      type: object
      title: AdvanceSessionRequest
      description: Request body for advancing a session.
    AlgorithmAuditEvent:
      properties:
        sequence:
          type: integer
          minimum: 1.0
          title: Sequence
        stage:
          type: string
          minLength: 1
          title: Stage
        rule_id:
          type: string
          minLength: 1
          title: Rule Id
        operation:
          type: string
          minLength: 1
          title: Operation
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
        output:
          title: Output
        references:
          items:
            type: string
          type: array
          title: References
        previous_event_hash:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Previous Event Hash
        event_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Event Hash
      additionalProperties: false
      type: object
      required:
      - sequence
      - stage
      - rule_id
      - operation
      - event_hash
      title: AlgorithmAuditEvent
    Alternative:
      properties:
        id:
          type: string
          pattern: ^S[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
        required_assumptions:
          items:
            type: string
          type: array
          title: Required Assumptions
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: Alternative
    AlternativeEvaluation:
      properties:
        alternative_id:
          type: string
          title: Alternative Id
        status:
          $ref: '#/components/schemas/AlternativeStatus'
        hard_constraints_passed:
          type: boolean
          title: Hard Constraints Passed
        constraint_checks:
          items:
            $ref: '#/components/schemas/ConstraintCheck'
          type: array
          title: Constraint Checks
        criterion_scores:
          items:
            $ref: '#/components/schemas/CriterionScore'
          type: array
          title: Criterion Scores
        base_score:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Base Score
        soft_constraint_penalty:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Soft Constraint Penalty
          default: '0'
        total_score:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Total Score
        missing_metrics:
          items:
            type: string
          type: array
          title: Missing Metrics
        unavailable_evidence_ids:
          items:
            type: string
          type: array
          title: Unavailable Evidence Ids
      additionalProperties: false
      type: object
      required:
      - alternative_id
      - status
      - hard_constraints_passed
      - constraint_checks
      title: AlternativeEvaluation
    AlternativeStatus:
      type: string
      enum:
      - eligible
      - ineligible
      - incomplete
      title: AlternativeStatus
    ApprovalRecord:
      properties:
        approved:
          type: boolean
          title: Approved
        approver:
          type: string
          title: Approver
        authorization_ref:
          type: string
          title: Authorization Ref
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        approved_at:
          type: string
          format: date-time
          title: Approved At
      additionalProperties: false
      type: object
      required:
      - approved
      - approver
      - authorization_ref
      title: ApprovalRecord
    ApprovalRequest:
      properties:
        approved:
          type: boolean
          title: Approved
        approver:
          type: string
          minLength: 1
          title: Approver
        authorization_ref:
          type: string
          minLength: 1
          title: Authorization Ref
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - approved
      - approver
      - authorization_ref
      title: ApprovalRequest
    Assumption:
      properties:
        id:
          type: string
          pattern: ^A[0-9A-Za-z_-]+$
          title: Id
        statement:
          type: string
          minLength: 1
          title: Statement
        source:
          $ref: '#/components/schemas/AssumptionSource'
        falsification_condition:
          type: string
          minLength: 1
          title: Falsification Condition
        critical:
          type: boolean
          title: Critical
          default: true
        dependencies:
          items:
            type: string
          type: array
          title: Dependencies
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        responsibility:
          anyOf:
          - $ref: '#/components/schemas/ResponsibilityRef'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - id
      - statement
      - source
      - falsification_condition
      title: Assumption
    AssumptionSource:
      type: string
      enum:
      - explicit
      - inferred
      title: AssumptionSource
    AssumptionState:
      type: string
      enum:
      - assumed
      - verified
      - falsified
      - unfalsifiable
      title: AssumptionState
      description: 'Per-round assumption state inside a reconstruction session.


        Transitions are monotone: once VERIFIED or FALSIFIED an assumption never

        returns to ASSUMED. UNFALSIFIABLE is a terminal human-declared state.'
    AuditIssue:
      properties:
        code:
          type: string
          title: Code
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        path:
          type: string
          title: Path
        message:
          type: string
          title: Message
        blocking:
          type: boolean
          title: Blocking
          default: false
      additionalProperties: false
      type: object
      required:
      - code
      - severity
      - path
      - message
      title: AuditIssue
    CausalReconstructionReport:
      properties:
        reconstruction_id:
          type: string
          pattern: ^REC-[0-9A-Za-z_-]+$
          title: Reconstruction Id
        hypotheses:
          items:
            $ref: '#/components/schemas/RootCauseHypothesis'
          type: array
          title: Hypotheses
        signal_count:
          type: integer
          minimum: 0.0
          title: Signal Count
          description: 输入的偏差信号总数
        root_candidate_count:
          type: integer
          minimum: 0.0
          title: Root Candidate Count
          description: 去重后的根因候选数
        unresolved_branches:
          items:
            type: string
          type: array
          title: Unresolved Branches
          description: 因信息真空无法继续追溯的假设 ID
        algorithm_audit:
          items:
            $ref: '#/components/schemas/AlgorithmAuditEvent'
          type: array
          title: Algorithm Audit
        algorithm_audit_root_hash:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Algorithm Audit Root Hash
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - reconstruction_id
      - signal_count
      - root_candidate_count
      title: CausalReconstructionReport
      description: '因果重构推演报告。


        包含一组候选根因假设和追溯过程的审计信息。

        报告本身不声称确定性结论——它是一份结构化的诊断输入，

        供决策者验证后使用。'
    CognitiveAuditReport:
      properties:
        findings:
          items:
            $ref: '#/components/schemas/CognitiveRiskFinding'
          type: array
          title: Findings
        total_findings:
          type: integer
          minimum: 0.0
          title: Total Findings
        scanner_version:
          type: string
          minLength: 1
          title: Scanner Version
      additionalProperties: false
      type: object
      required:
      - total_findings
      - scanner_version
      title: CognitiveAuditReport
      description: Structured cognitive audit report.
    CognitiveRiskFinding:
      properties:
        code:
          type: string
          minLength: 1
          title: Code
          description: 风险代码，如 ANCHORING、CONFIRMATION_BIAS
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        description:
          type: string
          minLength: 1
          title: Description
          description: 风险描述
        affected_elements:
          items:
            type: string
          type: array
          title: Affected Elements
          description: 受影响的结构元素路径
        recommendation:
          type: string
          title: Recommendation
          description: 推荐缓解措施
          default: ''
      additionalProperties: false
      type: object
      required:
      - code
      - severity
      - description
      title: CognitiveRiskFinding
      description: A single structural cognitive risk finding.
    Constraint-Input:
      properties:
        id:
          type: string
          pattern: ^C[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        kind:
          $ref: '#/components/schemas/ConstraintKind'
        metric:
          type: string
          minLength: 1
          title: Metric
        operator:
          $ref: '#/components/schemas/ConstraintOperator'
        expected:
          title: Expected
        penalty:
          anyOf:
          - type: number
            maximum: 1.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Penalty
          description: Explicit score deduction for a failed soft constraint.
        responsibility:
          $ref: '#/components/schemas/ResponsibilityRef'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - kind
      - metric
      - operator
      - expected
      - responsibility
      title: Constraint
    Constraint-Output:
      properties:
        id:
          type: string
          pattern: ^C[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        kind:
          $ref: '#/components/schemas/ConstraintKind'
        metric:
          type: string
          minLength: 1
          title: Metric
        operator:
          $ref: '#/components/schemas/ConstraintOperator'
        expected:
          title: Expected
        penalty:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Penalty
          description: Explicit score deduction for a failed soft constraint.
        responsibility:
          $ref: '#/components/schemas/ResponsibilityRef'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - kind
      - metric
      - operator
      - expected
      - responsibility
      title: Constraint
    ConstraintCheck:
      properties:
        constraint_id:
          type: string
          title: Constraint Id
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
        actual:
          title: Actual
        expected:
          title: Expected
        reason:
          type: string
          title: Reason
      additionalProperties: false
      type: object
      required:
      - constraint_id
      - passed
      - reason
      title: ConstraintCheck
    ConstraintKind:
      type: string
      enum:
      - hard
      - soft
      title: ConstraintKind
    ConstraintOperator:
      type: string
      enum:
      - eq
      - ne
      - gt
      - gte
      - lt
      - lte
      - in
      - not_in
      title: ConstraintOperator
    ConvergenceKind:
      type: string
      enum:
      - fixed_point
      - no_gain
      - budget
      title: ConvergenceKind
      description: 'Why a reconstruction session stopped.


        - FIXED_POINT: re-evaluation changed neither candidates nor hypothesis set.

        - NO_GAIN:     no unresolved branches remain and every open hypothesis is answered.

        - BUDGET:      iteration or evidence budget exhausted.'
    ConvergenceReport:
      properties:
        kind:
          $ref: '#/components/schemas/ConvergenceKind'
          description: 收敛类型：fixed_point / no_gain / budget
        reconstruction_id:
          type: string
          pattern: ^REC-[0-9A-Za-z_-]+$
          title: Reconstruction Id
        delta_vars:
          items:
            $ref: '#/components/schemas/DeltaVar'
          type: array
          title: Delta Vars
        before_leading_candidate_ids:
          items:
            type: string
          type: array
          title: Before Leading Candidate Ids
        after_leading_candidate_ids:
          items:
            type: string
          type: array
          title: After Leading Candidate Ids
        candidate_set_changed:
          type: boolean
          title: Candidate Set Changed
          description: 应用 delta 后领先候选集合是否变化
        invalidated_assumption_ids:
          items:
            type: string
          type: array
          title: Invalidated Assumption Ids
        is_converged:
          type: boolean
          title: Is Converged
          description: 是否已到达收敛点
        reason:
          type: string
          minLength: 1
          title: Reason
          description: 人类可读的收敛/停止说明
        algorithm_audit:
          items:
            $ref: '#/components/schemas/AlgorithmAuditEvent'
          type: array
          title: Algorithm Audit
        algorithm_audit_root_hash:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Algorithm Audit Root Hash
      additionalProperties: false
      type: object
      required:
      - kind
      - reconstruction_id
      - candidate_set_changed
      - is_converged
      - reason
      title: ConvergenceReport
      description: 'Third-layer result: what changes when declared delta_vars are applied.'
    CounterfactualResult:
      properties:
        trigger_assumption_id:
          type: string
          title: Trigger Assumption Id
        status:
          $ref: '#/components/schemas/CounterfactualStatus'
        invalidated_assumption_ids:
          items:
            type: string
          type: array
          title: Invalidated Assumption Ids
        removed_alternative_ids:
          items:
            type: string
          type: array
          title: Removed Alternative Ids
        remaining_eligible_alternative_ids:
          items:
            type: string
          type: array
          title: Remaining Eligible Alternative Ids
        baseline_leading_candidate_ids:
          items:
            type: string
          type: array
          title: Baseline Leading Candidate Ids
        counterfactual_leading_candidate_ids:
          items:
            type: string
          type: array
          title: Counterfactual Leading Candidate Ids
        counterfactual_pareto_frontier_ids:
          items:
            type: string
          type: array
          title: Counterfactual Pareto Frontier Ids
        decision_changed:
          type: boolean
          title: Decision Changed
      additionalProperties: false
      type: object
      required:
      - trigger_assumption_id
      - status
      - invalidated_assumption_ids
      - removed_alternative_ids
      - remaining_eligible_alternative_ids
      - baseline_leading_candidate_ids
      - counterfactual_leading_candidate_ids
      - counterfactual_pareto_frontier_ids
      - decision_changed
      title: CounterfactualResult
    CounterfactualStatus:
      type: string
      enum:
      - leader_stable
      - leader_changed
      - no_viable_alternative
      title: CounterfactualStatus
    Criterion-Input:
      properties:
        id:
          type: string
          pattern: ^K[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        metric:
          type: string
          minLength: 1
          title: Metric
        weight:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Weight
        scoring_rule:
          $ref: '#/components/schemas/ScoringRule'
        min_value:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Min Value
        max_value:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Max Value
        target_value:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Target Value
        responsibility:
          $ref: '#/components/schemas/ResponsibilityRef'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - metric
      - weight
      - scoring_rule
      - min_value
      - max_value
      - responsibility
      title: Criterion
    Criterion-Output:
      properties:
        id:
          type: string
          pattern: ^K[0-9A-Za-z_-]+$
