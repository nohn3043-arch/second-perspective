openapi: 3.1.0
info:
  title: Second Perspective Super Decision-Hub
  description: Auditable decision orchestration with deterministic evaluation, causal counterfactuals,
    scenario stress tests, cognitive risk challenges, and governance.
  version: 0.3.0
paths:
  /health:
    get:
      summary: Health Check
      operationId: healthCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthcheck
  /v1/hub/analyze:
    post:
      summary: Analyze Decision Hub
      operationId: analyzeDecisionHub
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/hub/reports/{hub_run_id}:
    get:
      summary: Get Decision Hub Report
      operationId: getDecisionHubReport
      parameters:
      - name: hub_run_id
        in: path
        required: true
        schema:
          type: string
          title: Hub Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/evaluate:
    post:
      summary: Evaluate Decision
      operationId: evaluateDecision
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest-Input'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/{decision_id}:
    get:
      summary: Get Decision
      operationId: getDecision
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/{decision_id}/history:
    get:
      summary: Get Decision History
      operationId: getDecisionHistory
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionRecord'
                title: Response Getdecisionhistory
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/decisions/{decision_id}/approval:
    post:
      summary: Record Decision Approval
      operationId: recordDecisionApproval
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
components:
  schemas:
    AlgorithmAuditEvent:
      properties:
        sequence:
          type: integer
          minimum: 1.0
          title: Sequence
        stage:
          type: string
          minLength: 1
          title: Stage
        rule_id:
          type: string
          minLength: 1
          title: Rule Id
        operation:
          type: string
          minLength: 1
          title: Operation
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
        output:
          title: Output
        references:
          items:
            type: string
          type: array
          title: References
        previous_event_hash:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Previous Event Hash
        event_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Event Hash
      additionalProperties: false
      type: object
      required:
      - sequence
      - stage
      - rule_id
      - operation
      - event_hash
      title: AlgorithmAuditEvent
    Alternative:
      properties:
        id:
          type: string
          pattern: ^S[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
        required_assumptions:
          items:
            type: string
          type: array
          title: Required Assumptions
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: Alternative
    AlternativeEvaluation:
      properties:
        alternative_id:
          type: string
          title: Alternative Id
        status:
          $ref: '#/components/schemas/AlternativeStatus'
        hard_constraints_passed:
          type: boolean
          title: Hard Constraints Passed
        constraint_checks:
          items:
            $ref: '#/components/schemas/ConstraintCheck'
          type: array
          title: Constraint Checks
        criterion_scores:
          items:
            $ref: '#/components/schemas/CriterionScore'
          type: array
          title: Criterion Scores
        base_score:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Base Score
        soft_constraint_penalty:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Soft Constraint Penalty
          default: '0'
        total_score:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Total Score
        missing_metrics:
          items:
            type: string
          type: array
          title: Missing Metrics
        unavailable_evidence_ids:
          items:
            type: string
          type: array
          title: Unavailable Evidence Ids
      additionalProperties: false
      type: object
      required:
      - alternative_id
      - status
      - hard_constraints_passed
      - constraint_checks
      title: AlternativeEvaluation
    AlternativeStatus:
      type: string
      enum:
      - eligible
      - ineligible
      - incomplete
      title: AlternativeStatus
    ApprovalRecord:
      properties:
        approved:
          type: boolean
          title: Approved
        approver:
          type: string
          title: Approver
        authorization_ref:
          type: string
          title: Authorization Ref
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        approved_at:
          type: string
          format: date-time
          title: Approved At
      additionalProperties: false
      type: object
      required:
      - approved
      - approver
      - authorization_ref
      title: ApprovalRecord
    ApprovalRequest:
      properties:
        approved:
          type: boolean
          title: Approved
        approver:
          type: string
          minLength: 1
          title: Approver
        authorization_ref:
          type: string
          minLength: 1
          title: Authorization Ref
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - approved
      - approver
      - authorization_ref
      title: ApprovalRequest
    Assumption:
      properties:
        id:
          type: string
          pattern: ^A[0-9A-Za-z_-]+$
          title: Id
        statement:
          type: string
          minLength: 1
          title: Statement
        source:
          $ref: '#/components/schemas/AssumptionSource'
        falsification_condition:
          type: string
          minLength: 1
          title: Falsification Condition
        critical:
          type: boolean
          title: Critical
          default: true
        dependencies:
          items:
            type: string
          type: array
          title: Dependencies
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        responsibility:
          anyOf:
          - $ref: '#/components/schemas/ResponsibilityRef'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - id
      - statement
      - source
      - falsification_condition
      title: Assumption
    AssumptionSource:
      type: string
      enum:
      - explicit
      - inferred
      title: AssumptionSource
    AuditIssue:
      properties:
        code:
          type: string
          title: Code
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        path:
          type: string
          title: Path
        message:
          type: string
          title: Message
        blocking:
          type: boolean
          title: Blocking
          default: false
      additionalProperties: false
      type: object
      required:
      - code
      - severity
      - path
      - message
      title: AuditIssue
    CognitiveAuditReport:
      properties:
        scanner_id:
          type: string
          title: Scanner Id
        version:
          type: string
          title: Version
        findings:
          items:
            $ref: '#/components/schemas/CognitiveRiskFinding'
          type: array
          title: Findings
        counts:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/IssueSeverity'
          type: object
          title: Counts
      additionalProperties: false
      type: object
      required:
      - scanner_id
      - version
      title: CognitiveAuditReport
    CognitiveRiskFinding:
      properties:
        code:
          type: string
          title: Code
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        title:
          type: string
          title: Title
        explanation:
          type: string
          title: Explanation
        evidence_refs:
          items:
            type: string
          type: array
          title: Evidence Refs
        challenge_question:
          type: string
          title: Challenge Question
      additionalProperties: false
      type: object
      required:
      - code
      - severity
      - title
      - explanation
      - challenge_question
      title: CognitiveRiskFinding
    Constraint-Input:
      properties:
        id:
          type: string
          pattern: ^C[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        kind:
          $ref: '#/components/schemas/ConstraintKind'
        metric:
          type: string
          minLength: 1
          title: Metric
        operator:
          $ref: '#/components/schemas/ConstraintOperator'
        expected:
          title: Expected
        penalty:
          anyOf:
          - type: number
            maximum: 1.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Penalty
          description: Explicit score deduction for a failed soft constraint.
        responsibility:
          $ref: '#/components/schemas/ResponsibilityRef'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - kind
      - metric
      - operator
      - expected
      - responsibility
      title: Constraint
    Constraint-Output:
      properties:
        id:
          type: string
          pattern: ^C[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        kind:
          $ref: '#/components/schemas/ConstraintKind'
        metric:
          type: string
          minLength: 1
          title: Metric
        operator:
          $ref: '#/components/schemas/ConstraintOperator'
        expected:
          title: Expected
        penalty:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Penalty
          description: Explicit score deduction for a failed soft constraint.
        responsibility:
          $ref: '#/components/schemas/ResponsibilityRef'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - kind
      - metric
      - operator
      - expected
      - responsibility
      title: Constraint
    ConstraintCheck:
      properties:
        constraint_id:
          type: string
          title: Constraint Id
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
        actual:
          title: Actual
        expected:
          title: Expected
        reason:
          type: string
          title: Reason
      additionalProperties: false
      type: object
      required:
      - constraint_id
      - passed
      - reason
      title: ConstraintCheck
    ConstraintKind:
      type: string
      enum:
      - hard
      - soft
      title: ConstraintKind
    ConstraintOperator:
      type: string
      enum:
      - eq
      - ne
      - gt
      - gte
      - lt
      - lte
      - in
      - not_in
      title: ConstraintOperator
    CounterfactualResult:
      properties:
        trigger_assumption_id:
          type: string
          title: Trigger Assumption Id
        status:
          $ref: '#/components/schemas/CounterfactualStatus'
        invalidated_assumption_ids:
          items:
            type: string
          type: array
          title: Invalidated Assumption Ids
        removed_alternative_ids:
          items:
            type: string
          type: array
          title: Removed Alternative Ids
        remaining_eligible_alternative_ids:
          items:
            type: string
          type: array
          title: Remaining Eligible Alternative Ids
        baseline_leading_candidate_ids:
          items:
            type: string
          type: array
          title: Baseline Leading Candidate Ids
        counterfactual_leading_candidate_ids:
          items:
            type: string
          type: array
          title: Counterfactual Leading Candidate Ids
        counterfactual_pareto_frontier_ids:
          items:
            type: string
          type: array
          title: Counterfactual Pareto Frontier Ids
        decision_changed:
          type: boolean
          title: Decision Changed
      additionalProperties: false
      type: object
      required:
      - trigger_assumption_id
      - status
      - invalidated_assumption_ids
      - removed_alternative_ids
      - remaining_eligible_alternative_ids
      - baseline_leading_candidate_ids
      - counterfactual_leading_candidate_ids
      - counterfactual_pareto_frontier_ids
      - decision_changed
      title: CounterfactualResult
    CounterfactualStatus:
      type: string
      enum:
      - leader_stable
      - leader_changed
      - no_viable_alternative
      title: CounterfactualStatus
    Criterion-Input:
      properties:
        id:
          type: string
          pattern: ^K[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        metric:
          type: string
          minLength: 1
          title: Metric
        weight:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Weight
        scoring_rule:
          $ref: '#/components/schemas/ScoringRule'
        min_value:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Min Value
        max_value:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Max Value
        target_value:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Target Value
        responsibility:
          $ref: '#/components/schemas/ResponsibilityRef'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - metric
      - weight
      - scoring_rule
      - min_value
      - max_value
      - responsibility
      title: Criterion
    Criterion-Output:
      properties:
        id:
          type: string
          pattern: ^K[0-9A-Za-z_-]+$
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        metric:
          type: string
          minLength: 1
          title: Metric
        weight:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Weight
        scoring_rule:
          $ref: '#/components/schemas/ScoringRule'
        min_value:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Min Value
        max_value:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Max Value
        target_value:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Target Value
        responsibility:
          $ref: '#/components/schemas/ResponsibilityRef'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - metric
      - weight
      - scoring_rule
      - min_value
      - max_value
      - responsibility
      title: Criterion
    CriterionScore:
      properties:
        criterion_id:
          type: string
          title: Criterion Id
        actual:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Actual
        normalized_score:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Normalized Score
        weighted_score:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Weighted Score
      additionalProperties: false
      type: object
      required:
      - criterion_id
      - actual
      - normalized_score
      - weighted_score
      title: CriterionScore
    DecisionRecord:
      properties:
        request:
          $ref: '#/components/schemas/DecisionRequest-Output'
        result:
          $ref: '#/components/schemas/DecisionResult'
        approval:
          anyOf:
          - $ref: '#/components/schemas/ApprovalRecord'
          - type: 'null'
        revision:
          type: integer
          minimum: 1.0
          title: Revision
          default: 1
        parent_record_hash:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Parent Record Hash
        record_hash:
          type: string
          pattern: ^$|^[0-9a-f]{64}$
          title: Record Hash
          default: ''
      additionalProperties: false
      type: object
      required:
      - request
      - result
      title: DecisionRecord
    DecisionRequest-Input:
      properties:
        decision_id:
          anyOf:
          - type: string
            pattern: ^DEC-[0-9A-Za-z_-]+$
          - type: 'null'
          title: Decision Id
        objective:
          type: string
          minLength: 1
          title: Objective
        decision_owner:
          $ref: '#/components/schemas/ResponsibilityRef'
        time_horizon:
          anyOf:
          - type: string
          - type: 'null'
          title: Time Horizon
        evaluation_as_of:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Evaluation As Of
          description: Explicit replay time used for temporal evidence checks.
        evaluation_mode:
          $ref: '#/components/schemas/EvaluationMode'
          default: constraint_only
        criteria:
          items:
            $ref: '#/components/schemas/Criterion-Input'
          type: array
          title: Criteria
        constraints:
          items:
            $ref: '#/components/schemas/Constraint-Input'
          type: array
          title: Constraints
        assumptions:
          items:
            $ref: '#/components/schemas/Assumption'
          type: array
          title: Assumptions
        alternatives:
          items:
            $ref: '#/components/schemas/Alternative'
          type: array
          minItems: 1
          title: Alternatives
        evidence:
          items:
            $ref: '#/components/schemas/Evidence-Input'
          type: array
          title: Evidence
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - objective
      - decision_owner
      - alternatives
      title: DecisionRequest
    DecisionRequest-Output:
      properties:
        decision_id:
          anyOf:
          - type: string
            pattern: ^DEC-[0-9A-Za-z_-]+$
          - type: 'null'
          title: Decision Id
        objective:
          type: string
          minLength: 1
          title: Objective
        decision_owner:
          $ref: '#/components/schemas/ResponsibilityRef'
        time_horizon:
          anyOf:
          - type: string
          - type: 'null'
          title: Time Horizon
        evaluation_as_of:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Evaluation As Of
          description: Explicit replay time used for temporal evidence checks.
        evaluation_mode:
          $ref: '#/components/schemas/EvaluationMode'
          default: constraint_only
        criteria:
          items:
            $ref: '#/components/schemas/Criterion-Output'
          type: array
          title: Criteria
        constraints:
          items:
            $ref: '#/components/schemas/Constraint-Output'
          type: array
          title: Constraints
        assumptions:
          items:
            $ref: '#/components/schemas/Assumption'
          type: array
          title: Assumptions
        alternatives:
          items:
            $ref: '#/components/schemas/Alternative'
          type: array
          minItems: 1
          title: Alternatives
        evidence:
          items:
            $ref: '#/components/schemas/Evidence-Output'
          type: array
          title: Evidence
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - objective
      - decision_owner
      - alternatives
      title: DecisionRequest
    DecisionResult:
      properties:
        decision_id:
          type: string
          title: Decision Id
        status:
          $ref: '#/components/schemas/DecisionStatus'
        objective:
          type: string
          title: Objective
        evaluation_mode:
          $ref: '#/components/schemas/EvaluationMode'
        audit_passed:
          type: boolean
          title: Audit Passed
        issues:
          items:
            $ref: '#/components/schemas/AuditIssue'
          type: array
          title: Issues
        alternatives:
          items:
            $ref: '#/components/schemas/AlternativeEvaluation'
          type: array
          title: Alternatives
        eligible_alternative_ids:
          items:
            type: string
          type: array
          title: Eligible Alternative Ids
        leading_candidate_ids:
          items:
            type: string
          type: array
          title: Leading Candidate Ids
        failure_branches:
          items:
            $ref: '#/components/schemas/FailureBranch'
          type: array
          title: Failure Branches
        responsibility_map:
          items:
            $ref: '#/components/schemas/ResponsibilityEntry'
          type: array
          title: Responsibility Map
        unresolved_variables:
          items:
            type: string
          type: array
          title: Unresolved Variables
        robustness:
          $ref: '#/components/schemas/RobustnessReport'
        counterfactuals:
          items:
            $ref: '#/components/schemas/CounterfactualResult'
          type: array
          title: Counterfactuals
        trace:
          items:
            $ref: '#/components/schemas/TraceEntry'
          type: array
          title: Trace
        algorithm_audit:
          items:
            $ref: '#/components/schemas/AlgorithmAuditEvent'
          type: array
          title: Algorithm Audit
        algorithm_audit_root_hash:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Algorithm Audit Root Hash
        policy:
          $ref: '#/components/schemas/PolicySnapshot'
        engine_version:
          type: string
