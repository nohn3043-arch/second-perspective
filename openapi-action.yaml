    ReconstructionKind:
      type: string
      enum:
      - forward_propagation
      - backward_tracing
      - delta_reconstruction
      title: ReconstructionKind
      description: 'The three layers of causal reconstruction.


        1. FORWARD_PROPAGATION  — invalidation_closure: A1 fails → what else breaks.

        2. BACKWARD_TRACING     — CausalReconstructor: deviation → candidate root cause.

        3. DELTA_RECONSTRUCTION — apply declared delta_vars, re-evaluate, check convergence.'
    ReconstructionSession:
      properties:
        session_id:
          type: string
          pattern: ^SESS-[0-9A-Za-z_-]+$
          title: Session Id
        request:
          $ref: '#/components/schemas/DecisionRequest-Output'
        deviation_signals:
          items:
            $ref: '#/components/schemas/DeviationSignal'
          type: array
          title: Deviation Signals
        rounds:
          items:
            $ref: '#/components/schemas/SessionRound'
          type: array
          title: Rounds
        assumption_states:
          additionalProperties:
            $ref: '#/components/schemas/AssumptionState'
          type: object
          title: Assumption States
        status:
          $ref: '#/components/schemas/SessionStatus'
          default: active
        convergence_kind:
          anyOf:
          - $ref: '#/components/schemas/ConvergenceKind'
          - type: 'null'
        max_iterations:
          type: integer
          minimum: 1.0
          title: Max Iterations
          description: 最大推演轮次预算
          default: 5
        max_evidence_requests:
          type: integer
          minimum: 1.0
          title: Max Evidence Requests
          description: 最大证据请求预算
          default: 20
        session_root_hash:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Session Root Hash
        created_at:
          type: string
          format: date-time
          title: Created At
        sealed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Sealed At
      additionalProperties: false
      type: object
      required:
      - session_id
      - request
      title: ReconstructionSession
      description: 'A bounded, hash-chained, human-gated reconstruction session.


        Replaces single-shot reconstruction with an iterative process: each round

        runs forward propagation → backward tracing → delta reconstruction, records

        all events into a session-level hash chain, and pauses for a human decision.

        The session converges when no new information is produced, or stops when an

        explicit budget is exhausted.'
