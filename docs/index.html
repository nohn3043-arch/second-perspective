<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Perspective · 认知审计引擎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy-900: #0F172A;
            --navy-800: #1E293B;
            --navy-700: #334155;
            --navy-600: #475569;
            --blue-600: #2563EB;
            --blue-500: #3B82F6;
            --blue-400: #60A5FA;
            --slate-100: #F1F5F9;
            --slate-200: #E2E8F0;
            --white: #FFFFFF;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
            color: var(--slate-100);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 全局动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.8s ease forwards;
        }

        /* 导航栏 */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--blue-400) 0%, var(--blue-600) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--slate-200);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--blue-400);
        }

        /* 英雄区 */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            padding: 0 2rem;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 70% 30%, rgba(37, 99, 235, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            animation: fadeInUp 0.8s ease 0.2s forwards;
            opacity: 0;
        }

        .hero-tag {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--blue-400);
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--white) 0%, var(--blue-200) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--slate-200);
            max-width: 600px;
            margin-bottom: 2.5rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--blue-600) 0%, var(--blue-500) 100%);
            color: var(--white);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--slate-100);
            border: 1px solid var(--navy-600);
        }

        .btn-secondary:hover {
            border-color: var(--blue-500);
            background: rgba(37, 99, 235, 0.05);
        }

        /* 特性区 */
        .features {
            padding: 8rem 2rem;
            background: var(--navy-900);
            position: relative;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 4rem;
        }

        .section-tag {
            display: inline-block;
            padding: 0.375rem 1rem;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--blue-400);
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: clamp(1.875rem, 3vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .section-description {
            color: var(--slate-200);
            font-size: 1.125rem;
        }

        .features-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .feature-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 1rem;
            padding: 2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .feature-card:hover {
            border-color: rgba(37, 99, 235, 0.5);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .feature-icon {
            width: 3rem;
            height: 3rem;
            background: linear-gradient(135deg, var(--blue-600) 0%, var(--blue-500) 100%);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .feature-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .feature-description {
            color: var(--slate-200);
            line-height: 1.7;
        }

        /* 架构区 */
        .architecture {
            padding: 8rem 2rem;
            background: linear-gradient(135deg, var(--navy-800) 0%, var(--navy-900) 100%);
        }

        .architecture-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .architecture-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 1rem;
            padding: 3rem;
            box-shadow: var(--shadow-xl);
            backdrop-filter: blur(10px);
        }

        .code-block {
            background: var(--navy-900);
            border: 1px solid var(--navy-700);
            border-radius: 0.75rem;
            padding: 1.5rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.875rem;
            line-height: 1.7;
            overflow-x: auto;
            margin-top: 2rem;
        }

        .code-keyword {
            color: var(--blue-400);
        }

        .code-comment {
            color: var(--navy-600);
        }

        /* 证书区 */
        .certifications {
            padding: 8rem 2rem;
            background: var(--navy-900);
        }

        .cert-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .cert-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .cert-card:hover {
            border-color: rgba(37, 99, 235, 0.5);
            transform: translateY(-4px);
        }

        .cert-badge {
            width: 4rem;
            height: 4rem;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        .cert-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .cert-description {
            color: var(--slate-200);
            font-size: 0.875rem;
        }

        /* 底部CTA */
        .cta {
            padding: 8rem 2rem;
            background: radial-gradient(circle at center, rgba(37, 99, 235, 0.1) 0%, transparent 70%), var(--navy-900);
            text-align: center;
        }

        .cta-title {
            font-size: clamp(1.875rem, 3vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .cta-description {
            color: var(--slate-200);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }

        /* 页脚 */
        .footer {
            padding: 3rem 2rem;
            background: var(--navy-900);
            border-top: 1px solid rgba(71, 85, 105, 0.2);
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-copyright {
            color: var(--navy-600);
            font-size: 0.875rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--navy-600);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--blue-400);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hero {
                padding-top: 6rem;
            }

            .hero-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            .features,
            .architecture,
            .certifications,
            .cta {
                padding: 4rem 2rem;
            }

            .architecture-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav
