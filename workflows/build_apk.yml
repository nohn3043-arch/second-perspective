name: Build Cognitive Audit Engine APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04          # 锁定 22.04，24.04 与 buildozer 不兼容
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17         # Buildozer 依赖 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps    # Buildozer 编译所需
        run: |
          sudo apt update
          sudo apt install -y autoconf automake libtool libltdl-dev \
            libffi-dev libssl-dev git zip unzip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Android licenses # 无人值守必须
        run: |
          mkdir -p ~/.android
          echo 'sdk.dir=$HOME/.buildozer/android/platform/android-sdk' >> ~/.android/repositories.cfg
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-audit-engine-apk
          path: bin/*.apk
