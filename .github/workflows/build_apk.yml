name: Build Cognitive Audit Engine APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 增加超时时间避免Kivy编译超时
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10（Buildozer最稳定兼容版本）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3.10-dev \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libtinfo5 \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            cmake \
            patchelf

      - name: Install Python build dependencies（锁定稳定版本）
        run: |
          python -m pip install --upgrade pip==23.3.1 setuptools==69.0.0 wheel
          python -m pip install cython==0.29.37 virtualenv buildozer==1.5.0

      - name: Automatically accept all Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # 让buildozer自动接受许可证
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r25b"
          yes | buildozer android update 2>&1 | head -200 || true

      - name: Build debug APK
        run: |
          buildozer android debug 2>&1

      - name: List build output
        if: always()
        run: |
          echo "=== Bin directory ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory"
          echo "=== Found APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cognitive-audit-engine-apk-v7.2.0
          path: bin/*.apk
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/logs/
            bin/
