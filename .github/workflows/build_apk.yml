name: Build Cognitive Audit Engine APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3.11-dev \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libtinfo5 \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.37 virtualenv buildozer

      - name: Initialize buildozer and accept Android licenses
        run: |
          # 自动接受Android SDK许可证，使用非交互式模式
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo "y" | buildozer android update || true
          # 确保所有许可证都已接受
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Check build output
        if: always()
        run: |
          ls -la bin/ 2>/dev/null || echo "No bin directory found"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cognitive-audit-engine-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/android/platform/build-*/dist*/build/outputs/apk/debug/*.log
            .buildozer/logs/
