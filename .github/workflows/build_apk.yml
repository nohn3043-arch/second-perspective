name: Build Cognitive Audit Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3.11-dev \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libtinfo5 \
            git \
            zip \
            unzip \
            wget

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython virtualenv
          python -m pip install https://github.com/kivy/buildozer/archive/master.zip

      - name: Build debug APK
        run: |
          buildozer android debug || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .buildozer/android/platform/build-*/*.log

      - name: Check build output
        run: |
          ls -la bin/ 2>/dev/null || echo "No bin directory found"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-audit-engine-apk
          path: bin/*.apk
