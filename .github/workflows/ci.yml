name: decision-foundation-ci

on:
  push:
    branches:
      - main
      - intelligent-decision-engine
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests with coverage gate
        run: pytest --cov=second_perspective --cov-report=term-missing --cov-fail-under=85

      - name: Verify generated OpenAPI is current
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi-action.yaml

      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
